<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyMan - Connexion</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(40, 167, 69, 0.85), rgba(40, 167, 69, 0.85)), 
                        url('https://i.imgur.com/YzvYTB9.jpeg');
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply;
        }

        .money-man-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(5px);
            text-align: center;
        }

        .logo {
            width: 120px;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: #28a745;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(40, 167, 69, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #d4edda;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.25);
            background: #ffffff;
            outline: none;
        }

        #loginBtn {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            color: white;
            padding: 16px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1.5rem;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
        }

        #loginBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .signup-prompt {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #d4edda;
        }

        .signup-link {
            color: #28a745;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
    </style>
</head>
<body>
    <div class="money-man-container">
        <img src="https://i.imgur.com/QaCMnOY.png" alt="MoneyMan Logo" class="logo">
        <h1>MoneyMan</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Adresse email ou numéro de téléphone</label>
                <input type="text" id="login" required>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" id="loginBtn">Se connecter</button>

            <div class="signup-prompt">
                <p>Pas encore de compte ? <a href="Phishing.html" class="signup-link">Créer un compte</a></p>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Simulation de connexion
            alert('Connexion réussie ! Redirection...');
            setTimeout(() => {
                window.location.href = '#';
            }, 1500);
        });
    </script>
</body>
</html>
